[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mekiki"
version = "0.1.0"
description = "Find the bad demonstrations before you train on them."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Brad Ward" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24,<2.4", "pyarrow>=14.0"]

[project.optional-dependencies]
coverage = ["scikit-learn>=1.3"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
mekiki = "mekiki.cli:main"

[project.urls]
Homepage = "https://github.com/bradward/mekiki"

[tool.hatch.build.targets.wheel]
packages = ["src/mekiki"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/mekiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mekiki --cov-report=term-missing"

[tool.coverage.run]
source = ["src/mekiki"]
